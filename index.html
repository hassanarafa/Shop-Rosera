<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/logo-swirl.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floria | Botanical Serenity</title>
    
    <style>
      /* Quick styling for the new logo */
      .logo-container {
        display: flex;
        align-items: center;
        padding: 20px;
        font-family: 'Georgia', serif;
      }
      .logo-icon {
        width: 40px;
        height: 40px;
        margin-right: 12px;
      }
      .logo-text {
        font-size: 1.5rem;
        letter-spacing: 2px;
        color: #2d5a27; /* Botanical Green */
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img src="/leaf-logo.svg" alt="Floria Logo" class="logo-icon">
        <span class="logo-text">Floria</span>
      </div>
    </header>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
